<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-white">
<section class="bg-[#91AC8F] h-64">
  <!-- Navbar -->
  <nav class="w-full px-10 py-4 flex items-center justify-between sticky top-0 z-50 bg-[#91AC8F]">
    <!-- Kiri: Logo -->
    <div class="flex items-center space-x-2">
      <img src="aset Landing/bran nav.png" alt="VoltShop Logo" class="h-14" />
    </div>

    <!-- Tengah: Search + Cart -->
    <div class="flex items-center gap-5">
      <input type="text" placeholder="Search..." class="w-[600px] px-6 py-3 text-lg bg-white rounded-xl border border-black outline-none"/>
      <img src="aset Landing/cart.png" alt="Cart" class="h-10 w-10"/>
    </div>

    <!-- Kanan: Settings + Profile -->
    <div class="flex items-center gap-4">
      <img src="aset Landing/setings.png" alt="Settings" class="w-[45px]" />
      <img src="aset Landing/Group 11.png" alt="Profile" class="w-[45px]" />
    </div>
  </nav>

  <!-- Form Profile -->
  <div class="flex items-center justify-center px-4 py-12 mt-[-20px]">
    <div class="bg-[#D9D9D9] rounded-xl p-20 max-w-full w-[1100px] h-[520px] flex flex-col md:flex-row gap-8 shadow-lg">

      <!-- Form Bagian Kiri -->
      <div class="flex-1 space-y-6">
        <div>
          <h2 class="font-bold text-xl mb-2">Change Biodata</h2>
          <label class="block text-gray-700 mb-1">Your Name</label>
          <input type="text" class="w-full px-4 py-2 rounded border border-gray-400 bg-[#FDF9F4]" />

          <label class="block mt-4 text-gray-700 mb-1">Date of Birth</label>
          <input type="date" class="w-full px-4 py-2 rounded border border-gray-400 bg-[#FDF9F4]" />
        </div>

        <div>
          <h2 class="font-bold text-xl mb-2 capitalize">Change Contact</h2>
          <label class="block text-gray-700 mb-1">Email</label>
          <input type="email" class="w-full px-4 py-2 rounded border border-gray-400 bg-[#FDF9F4]" />

          <label class="block mt-4 text-gray-700 mb-1">Phone Number</label>
          <input type="tel" class="w-full px-4 py-2 rounded border border-gray-400 bg-[#FDF9F4]" />
        </div>
      </div>

      <!-- Gambar Avatar -->
      <div class="flex items-center justify-center ">
        <img src="aset Landing/Group 11.png" alt="avatar" class="w-64 rounded-full border" />
      </div>
    </div>
  </div>
</section>
</body>
</html>
