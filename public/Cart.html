<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Keranjang</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script defer src="cart.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

  <!-- NAVBAR -->
  <nav class="px-4 sm:px-6 md:px-10 py-4 flex flex-wrap gap-4 items-center justify-between sticky top-0 z-50 bg-[#91AC8F]">
    <div class="flex items-center space-x-2">
      <img src="aset Landing/bran nav.png" alt="VoltShop Logo" class="h-12 w-auto" />
    </div>

    <div class="flex flex-wrap justify-center items-center gap-3 flex-1 sm:flex-none">
      <input type="text" placeholder="Search..."
        class="w-full sm:w-[400px] lg:w-[700px] px-4 py-2 text-base sm:text-xl bg-white rounded-xl border border-black outline-none"/>
      <img src="aset Landing/cart.png" alt="Cart" class="h-10 w-10"/>
    </div>

    <div class="flex items-center gap-2">
      <img src="aset Landing/setings.png" alt="Settings" class="w-[40px] sm:w-[50px]" />
      <a href="profile.html">
        <img src="aset Landing/Group 11.png" alt="Profile" class="w-[37px] sm:w-[47px]" />
      </a>
    </div>
  </nav>

  <!-- KONTEN -->
  <div class="px-4 sm:px-8 py-8">
    <h1 class="text-2xl sm:text-3xl font-bold mb-6 text-center">Keranjang Belanja</h1>

    <!-- Pilih Semua -->
    <div class="flex items-center gap-2 mb-6">
      <input type="checkbox" id="select-all" class="w-5 h-5" />
      <label for="select-all" class="text-lg font-medium">Pilih Semua</label>
    </div>

    <!-- Wrapper -->
    <div class="flex flex-col lg:flex-row gap-8">
      <!-- Daftar Produk -->
      <div id="cart-items" class="flex flex-col gap-4 w-full lg:flex-1"></div>

      <!-- Shopping Summary -->
      <div class="w-full lg:w-1/3 h-fit bg-[#D9D9D9] rounded p-6 shadow-lg sticky top-10">
        <h2 class="text-xl font-semibold mb-4">Shopping Summary</h2>
        <p class="text-md mb-1">Sub Total (<span id="item-count">0</span> item)</p>
        <p class="text-red-600 text-2xl font-bold mb-6" id="total-price">RP. 0</p>
        <button id="checkout-btn"
          class="bg-white w-full py-3 rounded-lg text-black border border-black font-semibold text-lg transition-all duration-300 transform hover:scale-105 hover:bg-[#91AC8F] hover:text-white hover:shadow-md">
          Checkout
        </button>
        <button id="clear-cart"
          class="bg-red-600 py-3 text-white rounded-lg mb-4 w-full text-lg mt-5 transition-all duration-300 transform hover:scale-105 hover:bg-white hover:text-red-600 hover:shadow-md">
          Hapus Semua
        </button>
      </div>
    </div>
  </div>

  <script src="/src/Cart.js"></script>
</body>
</html>
