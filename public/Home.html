<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Home</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=line-clamp"></script>
</head>

<body class="bg-gray-100">

  <!-- Navbar -->
  <nav class="px-4 md:px-10 py-4 flex flex-wrap md:flex-nowrap items-center justify-between sticky top-0 z-50" style="background-color: #91AC8F;">
    
    <!-- Logo -->
    <div class="flex items-center mb-4 md:mb-0">
      <img src="aset Landing/bran nav.png" alt="VoltShop Logo" class="h-12 md:h-14" />
    </div>
    
    <!-- Search dan Cart -->
    <div class="flex flex-col sm:flex-row justify-center items-center gap-4 flex-1 mb-4 md:mb-0">
      <input id="searchInput" type="text" placeholder="Search..." class="w-full sm:w-[300px] md:w-[400px] lg:w-[600px] px-4 py-2 text-base md:text-xl bg-white rounded-xl border border-black outline-none" />

      <a href="Cart.html">
        <img src="aset Landing/cart.png" alt="Cart" class="h-8 md:h-10 w-8 md:w-10" />
      </a>
    </div>
    
    <!-- Settings & Profile -->
    <div class="flex items-center gap-3">
      <img src="aset Landing/setings.png" alt="Settings" class="w-8 md:w-[50px]" />
      <a href="profile.html">
        <img src="aset Landing/Group 11.png" alt="Profile" class="w-8 md:w-[47px]" />
      </a>
    </div>
  </nav>


  <!-- Banner -->
  <section class="pt-8 pb-10 px-4 md:px-12">
    <div class="rounded-lg shadow-lg bg-[#D9D9D9]">
      <div class="flex justify-center items-center">
        <img src="/public/aset Landing/Group 12.png" alt="Banner" class="w-full max-h-[300px] object-cover rounded-lg" />
      </div>
    </div>
  </section>

  <!-- Kategori -->
<section class="px-4 md:px-10 mb-6">
  <div class="flex flex-wrap gap-3" id="category-container"></div>
</section>

  <!-- Produk -->
  <section class="pb-10 px-4 md:px-12">
    <div id="data-product" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Produk dari JS -->
    </div>
  </section>

  <script src="/src/Home.js"></script>
</body>
</html>
